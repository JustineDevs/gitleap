services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitleap
      POSTGRES_USER: gitleap
      POSTGRES_PASSWORD: gitleap
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitleap -d gitleap"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
